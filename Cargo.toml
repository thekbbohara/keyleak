[package]
name = "keyleak"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Find API keys leaked in your shell history, .env files, dotfiles and AI agent logs. Offline, read-only, always masked."
license = "MIT"
authors = ["thekbbohara <133592644+thekbbohara@users.noreply.github.com>"]
repository = "https://github.com/thekbbohara/keyleak"
homepage = "https://github.com/thekbbohara/keyleak"
readme = "README.md"
keywords = ["secrets", "security", "api-keys", "dotfiles", "cli"]
categories = ["command-line-utilities", "development-tools"]
include = ["src/**", "tests/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[dependencies]
regex = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
